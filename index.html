    <!Politique de confidentialité
Applications d'Anthony FERNANDEZ
Date de dernière mise à jour : 2 novembre 2026

La présente politique de confidentialité s'applique à l'ensemble des applications mobiles éditées par Anthony FERNANDEZ (ci-après « l'Éditeur »), notamment Taquin Cosmos et toute autre application publiée par l'Éditeur sur le Google Play Store (ci-après « l'Application » ou « les Applications »). Elle décrit la manière dont ces Applications traitent les données personnelles de leurs utilisateurs.

Les spécificités propres à chaque application, le cas échéant, sont détaillées à l'article 11 — Spécificités par application.

L'Éditeur peut être contacté à l'adresse suivante : applithony@gmail.com
1. Données traitées par l'Application
1.1 Données stockées localement sur votre appareil
L'Application enregistre certaines informations de jeu uniquement sur votre appareil (stockage local « SharedPreferences ») :

votre progression dans les niveaux ;
vos records (nombre de coups) ;
les images que vous avez réussies ;
l'état d'une partie en cours.
Ces données ne sont jamais transmises à l'Éditeur ni à aucun serveur. Elles restent sur votre appareil. Vous pouvez les supprimer à tout moment en désinstallant l'Application ou en effaçant les données de l'Application dans les paramètres Android.

1.2 Données collectées par la régie publicitaire (Google AdMob)
L'Application affiche des annonces publicitaires fournies par Google AdMob. Pour diffuser, mesurer et personnaliser ces annonces, ainsi que pour prévenir la fraude, le SDK Google Mobile Ads est susceptible de collecter automatiquement les informations suivantes :

l'identifiant publicitaire de votre appareil (Advertising ID) ;
des identifiants d'appareil et des informations techniques (modèle, version du système, opérateur) ;
votre adresse IP et des données de localisation approximatives (déduites de l'adresse IP) ;
des données d'utilisation et de diagnostic liées à l'affichage des annonces (interactions, impressions, performances).
Ces données peuvent être transmises à Google LLC et à ses partenaires publicitaires. L'Éditeur n'a pas accès à ces données individuelles et ne les collecte pas directement.

Pour plus d'informations, consultez la politique de confidentialité de Google : https://policies.google.com/privacy

2. Finalités du traitement
stocker votre progression locale dans le jeu ;
diffuser des annonces publicitaires dans l'Application ;
mesurer la performance des annonces et prévenir les usages frauduleux ;
personnaliser les annonces affichées, sauf si vous avez désactivé la personnalisation.
3. Base légale du traitement
Le traitement repose sur votre consentement au recueil de votre identifiant publicitaire à des fins de personnalisation, ainsi que sur l'intérêt légitime de l'Éditeur à diffuser des annonces afin de financer la gratuité de l'Application (article 6.1.f du RGPD).

4. Vos droits (RGPD)
Conformément au Règlement Général sur la Protection des Données (RGPD) et à la loi Informatique et Libertés, vous disposez des droits suivants :

droit d'accès à vos données ;
droit de rectification et droit à l'effacement ;
droit d'opposition et droit de retirer votre consentement à tout moment ;
droit à la portabilité et droit à la limitation du traitement.
Pour exercer ces droits, écrivez à applithony@gmail.com.

Important : vous pouvez également limiter le suivi publicitaire sur votre appareil :

désactivez la personnalisation des annonces dans les paramètres de votre appareil Android (Paramètres → Confidentialité → Annonces) ;
dans les versions récentes d'Android, réinitialisez ou supprimez votre identifiant publicitaire dans ces mêmes paramètres.
5. Partage des données
L'Éditeur ne vend ni ne loue vos données personnelles. Les seuls destinataires des données collectées via les publicités sont Google LLC et ses partenaires publicitaires, dans le cadre décrit à l'article 1.2.

6. Durée de conservation
Les données de jeu locales sont conservées jusqu'à la désinstallation de l'Application ou l'effacement des données de l'Application.
Les données collectées par Google AdMob sont traitées conformément à la politique de confidentialité de Google.
7. Enfants
L'Application n'est pas destinée aux enfants de moins de 13 ans. L'Éditeur ne collecte pas sciemment de données auprès d'enfants. Si vous estimez qu'un enfant utilise l'Application de manière inappropriée, contactez-nous à applithony@gmail.com.

8. Sécurité
L'Éditeur met en œuvre des mesures raisonnables pour protéger les données stockées localement sur votre appareil. Toutefois, aucune méthode de transmission ou de stockage n'étant totalement sécurisée, la sécurité absolue ne peut être garantie.

9. Modifications de la présente politique
L'Éditeur se réserve le droit de modifier la présente politique à tout moment. Toute modification substantielle sera signalée par la mise à jour de la date en tête de document et, le cas échéant, dans l'Application.

10. Contact
Pour toute question relative à la présente politique de confidentialité ou au traitement de vos données :

Anthony FERNANDEZ — applithony@gmail.com
11. Spécificités par application
Taquin Cosmos — aucune spécificité supplémentaire : l'Application ne collecte aucune donnée en dehors des éléments décrits aux articles 1.1 (stockage local uniquement) et 1.2 (SDK Google AdMob).

Toute future application présentant des spécificités — autorisations particulières, autres SDK, compte utilisateur, etc. — fera l'objet d'une mention ajoutée dans le présent article avant sa publication.

© 2026 Anthony FERNANDEZ — Tous droits réservés.
